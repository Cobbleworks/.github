name: Bug report
description: Report a reproducible problem in a Cobbleworks plugin
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve Cobbleworks. Remove secrets and private player data from logs before submitting.
  - type: input
    id: plugin-version
    attributes:
      label: Plugin version
      placeholder: "1.2.3"
    validations:
      required: true
  - type: input
    id: server-version
    attributes:
      label: Minecraft and server build
      placeholder: "Paper 26.2 build 121"
    validations:
      required: true
  - type: input
    id: java-version
    attributes:
      label: Java version
      placeholder: "25.0.1"
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: Explain the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Start a server with...
        2. Run...
        3. Observe...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      render: shell
